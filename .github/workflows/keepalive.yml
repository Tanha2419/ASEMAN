name: Render & GitHub 60-Day Keep-Alive

on:
  schedule:
    # اجرای خودکار هر ۱۰ دقیقه یک‌بار (جلوگیری از اسلیپ شدن رندر بعد از ۱۵ دقیقه)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # امکان اجرای دستی از تب Actions در گیت‌هاب

permissions:
  contents: write

jobs:
  keepalive:
    name: Ping Render & Keep GitHub Active
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # بخش ۱: پینگ زنده سرور رندر بدون نیاز به هیچ افزونه‌ای (۱۰۰٪ مستقل)
      - name: Ping Render Service
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          TARGET_URL="https://aseman-1-430y.onrender.com/healthz"
          echo "[$TIMESTAMP] Starting Keep-Alive ping to: $TARGET_URL"

          HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 40 \
            --retry 3 \
            --retry-delay 5 \
            "$TARGET_URL")

          echo "Response HTTP Code: $HTTP_CODE"
          if [ -f /tmp/health_response.json ]; then
            echo "Response Body: $(cat /tmp/health_response.json)"
          fi

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Render service is awake and healthy!"
          else
            echo "⚠️ Fallback pinging root URL..."
            ROOT_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 20 \
              --max-time 60 \
              --retry 2 \
              "https://aseman-1-430y.onrender.com/")
            echo "Root URL HTTP Code: $ROOT_CODE"
            if [ "$ROOT_CODE" -eq 200 ]; then
              echo "✅ Root URL woke up the service!"
            else
              echo "❌ Failed to ping Render service. Code: $ROOT_CODE"
              exit 1
            fi
          fi

      # بخش ۲: ثبت فعالیت در گیت‌هاب بدون نیاز به دانلود هیچ اکشن خارجی
      # این کار مانع از غیرفعال شدن ورک‌فلو بعد از ۶۰ روز توسط گیت‌هاب می‌شود
      - name: Keep GitHub Repo Active (Native Git)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking repository activity..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # کلون مستقیم ریپازیتوری با توکن خودکار
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo_dir
          cd repo_dir
          mkdir -p .github

          # ثبت ضربان قلب هفتگی
          CURRENT_WEEK=$(date -u +"%Y-W%U")
          HEARTBEAT_FILE=".github/keepalive-heartbeat.txt"
          LAST_WEEK=""
          if [ -f "$HEARTBEAT_FILE" ]; then
            LAST_WEEK=$(cat "$HEARTBEAT_FILE" | grep "WEEK:" | cut -d':' -f2 | tr -d ' ')
          fi

          if [ "$CURRENT_WEEK" != "$LAST_WEEK" ]; then
            echo "Updating heartbeat for $CURRENT_WEEK..."
            echo "WEEK: $CURRENT_WEEK" > "$HEARTBEAT_FILE"
            echo "UPDATED_AT: $(date -u)" >> "$HEARTBEAT_FILE"
            git add "$HEARTBEAT_FILE"
            git commit -m "chore(ci): keepalive heartbeat $CURRENT_WEEK [skip ci]"
            git push origin HEAD
            echo "✅ GitHub repository activity refreshed successfully!"
          else
            echo "✅ Heartbeat already up to date for this week ($CURRENT_WEEK)."
          fi
